const e = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789#$";
function de(s) {
    let n = 0;
    for (let i = 3; i >= 0; i--) {
        let c = s[i];
        let d = e.indexOf(c);
        n = (n * 64) + d;
    }
    let a = n % 256;
    n = Math.floor(n / 256);
    let b = n % 256;
    let c = Math.floor(n / 256);
    return { a, b, c };
}

	            let text = B.includes("/") ? B.slice(B.indexOf("/")+1) : "";
