	<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>decoder</title>
		<link rel="stylesheet" href="css.css" />
    </head>
    <body>
        <h1>decoder</h1>
        <p>to decode, go to the debug menu (first turn it on with /m l) then copy the value data and paste it here.</p>
        <p>select a block</p>
        <select name="type" id="type">
            <option value="speaker" selected>speaker</option>
            <option value="legacykeypad">_legacy keypad</option>
            <option value="keypad">keypad</option>
            <option value="http">http transmitter (useless)</option>
        </select>
        <br>
        <label for="data">data to decode</label><br>
        <input type="text" id="data" name="data"><br>
        <button id="decode">decode</button>
        <div id="output">
            <span>output</span>
            <pre><code id="code"></code></pre>
        </div>
        <script>
            const o = document.getElementById('code');
            const s = document.getElementById('type');
            const d = document.getElementById('decode');
            const D = document.getElementById('data');
            d.addEventListener('click', async () => {
              let u = D.value; // I finally fixed the most notorious bug that you had to refresh to load the new text, reason why: it was previously not inside the button handline mechanism
              // brain disconnected
function pc(str, d, c) {
  let r = [];
  let p = 0;
  for (let i = 0; i < c; i++) {
    if (p >= str.length) {
      r.push(d[i]);
      continue;
    }
	if (str[p] === '`') {
      r.push("");
      p += 1;
      continue;
    }
    let C = str.charCodeAt(p);
    let l = NaN;
    if (C >= 48 && C <= 57) l = C - 48;
    else if (C >= 97 && C <= 106) l = C - 87;
    if (isNaN(l)) {
      r.push(d[i]);
      p += 1; 
      continue; 
    }
    let L = l + 1;
    let v = p + 1;
    let V = v + L;
    if (V > str.length) {
      r.push(d[i]);
      p = str.length;
      continue;
    }
    r.push(str.slice(v, V));
    p = V;
  }
  while (r.length < c) {
    r.push(d[r.length]);
  }
  return r;
}
if (s.value === "speaker") {
  let b = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@\$%?&<()";
  function b71(id) {
    let nid = id.trim();
    let d = 0n;
    let p = 0n;
    for (let c of [...nid].reverse()) {
      let D = b.indexOf(c);
      if (D === -1) {
        throw new Error(`invalid char ${c}`);
      }
      d += BigInt(D) * (71n ** p);
      p += 1n;
    }
    return d;
  }
  let dv = ["1", "lolCv", "0.5", "1"];
  let a = pc(u, dv, 4);
  let id = b71(a[1]);
  let l = a[0] !== "0" ? 'ON' : 'OFF';
  o.innerHTML = "<b>Looped: </b>" + l + "<br><b>ID: </b>" + id + "<br><b>Volume: </b>" + a[2] + "<br><b>Pitch: </b>" + a[3];
} else if (s.value === "legacykeypad") { 
  let dv = ["1", "2", "1234", "1", "0.05"];
  let a = pc(u, dv, 5);
  let uoe = a[0] !== "0" ? 'ON' : 'OFF';
  let skp = a[3] !== "0" ? 'ON' : 'OFF';
  o.innerHTML = "<b>Unlock on Enter Key: </b>" + uoe + "<br><b>Unlocked Time: </b>" + a[1] + "<br><b>Code Digits: </b>" + a[2] + "<br><b>Show Key Press: </b>" + skp + "<br><b>Button Hold Time: </b>" + a[4];
} else if (s.value === "keypad") { 
    let b = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@\$%?&<()";
  function b71(id) {
    let nid = id.trim();
    let d = 0n; let p = 0n;
    for (let c of [...nid].reverse()) {
      let D = b.indexOf(c);
      if (D === -1) return "0";
      d += BigInt(D) * (71n ** p); p += 1n;
    }
    return String(d);
  }
  let dv = ["1", "2", "2gg", "1", "0.05"];
  let a = pc(u, dv, 5);
  let uoe = a[0] !== "0" ? 'ON' : 'OFF';
  let skp = a[3] !== "0" ? 'ON' : 'OFF';
  let ef = "";
  if(a[2]!==""){
  let scd = a[2].split(":");
  let dcd = [];
  for (let i = 0; i < scd.length; i++) {
    if (!scd[i]) continue;
    let dv = b71(scd[i]);
    dcd.push(dv.substring(1, dv.length));
  }
  if(dcd.length === 0) dcd.push("1234");
  ef = dcd.join("");
  }
  o.innerHTML = "<b>Unlock on Enter Key: </b>" + uoe + "<br><b>Unlocked Time: </b>" + a[1] + "<br><b>Code Digits: </b>" + ef + "<br><b>Show Key Press: </b>" + skp + "<br><b>Button Hold Time: </b>" + a[4];
} else if (s.value === "http") { 
let dv = ["0", "0.1", "", ""];
let a = pc(u, dv, 4);
let g = a[0] !== "0" ? 'ON' : 'OFF';
o.innerHTML = "<b>GET Requests: </b>" + g + "<br><b>GET Interval (seconds): </b>" + a[1] + "<br><b>Headers: </b>" + a[2] + "<br><b>Url: </b>" + a[3];
} else {
  o.innerHTML = "invalid choice"
}
            });
</script>
</body>
</html>
